server:
  port: 8080

spring:
  application:
    name: fruit-ecom-backend
  profiles:
    active: mysql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/fruitdb;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24

app:
  cors-allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
